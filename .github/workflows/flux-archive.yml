name: Publish FLUX measurement archives
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Create a temporary read identity for the experiment exports
        shell: bash
        run: |
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/export_key"
      - uses: actions/upload-artifact@v4
        with:
          name: export-public-key
          path: ${{ runner.temp }}/export_key.pub
          retention-days: 1
      - name: Publish completed archives to the experiment release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPORT_HOST: ${{ secrets.FLUX_EXPORT_HOST }}
          EXPORT_PORT: ${{ secrets.FLUX_EXPORT_PORT }}
          EXPORT_HOST_KEY: ${{ secrets.FLUX_EXPORT_HOST_KEY }}
        run: |
          set -eu
          echo "$EXPORT_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          fetch() {
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o LogLevel=ERROR -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -i "$RUNNER_TEMP/export_key" -p "$EXPORT_PORT" "root@$EXPORT_HOST" "$1"
          }
          while ! fetch list > "$RUNNER_TEMP/list"; do sleep 5; done
          while true; do
            doneflag=false
            while read -r name; do
              if [[ "$name" == COMPLETE ]]; then doneflag=true; continue; fi
              [[ "$name" =~ ^[A-Za-z0-9-]+\.zip$ ]] || continue
              [[ -e "$RUNNER_TEMP/$name.sent" ]] && continue
              fetch "$name" > "$RUNNER_TEMP/$name"
              gh release upload flux-binding-20261119 "$RUNNER_TEMP/$name" --repo "$GH_REPO" --clobber
              rm "$RUNNER_TEMP/$name"
              touch "$RUNNER_TEMP/$name.sent"
              echo "Published $name"
            done < "$RUNNER_TEMP/list"
            if $doneflag; then break; fi
            sleep 45
            fetch list > "$RUNNER_TEMP/list"
          done
